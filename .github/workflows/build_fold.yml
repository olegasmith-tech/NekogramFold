name: Build NekogramFold APK

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      - name: Configure Signing & Secrets
        run: |
          mkdir -p TMessagesProj_App
          echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks
          cp keystore.jks TMessagesProj_App/keystore.jks
          cat > local.properties << EOF
          storeFile=${{ github.workspace }}/keystore.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          apiId=${{ secrets.API_ID }}
          apiHash=${{ secrets.API_HASH }}
          sentryDsn=
          helperBotId=0
          helperBotUsername=
          mapsApiKey=
          EOF
          cp local.properties TMessagesProj_App/local.properties
          echo "" | base64 -d > TMessagesProj_App/google-services.json
          echo "" | base64 -d > google-services.json
          echo "cli.enabled=false" > sentry.properties
          echo "cli.enabled=false" > TMessagesProj_App/sentry.properties

      - name: Build APK (Release)
        run: |
          ./gradlew assembleRelease --stacktrace

      - name: Find Release APK
        id: find_apk
        run: |
          mkdir -p final_apk
          find . -name "*.apk" -path "*/release/*" -exec cp {} final_apk/ \;
          echo "Found APKs:"
          ls -la final_apk/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekogramFold-APK
          path: final_apk/
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "NekogramFold v1.0.${{ github.run_number }}"
          files: final_apk/*.apk
          generate_release_notes: false
          make_latest: true
